name: Android Beta APK build

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: lotot-ui/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Check translations
        run: node lotot-ui/scripts/check-i18n.mjs
      - name: Build and test current sources
        run: ./gradlew --no-daemon :library:test :androbd:testVerificationUnitTest :androbd:lintDebug :androbd:assembleDebug :androbd:assembleVerification :androbd:assembleVerificationAndroidTest --stacktrace
      - name: APK checksums
        run: find androbd/build/outputs/apk -name '*.apk' -exec sha256sum {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotot-build-and-tests
          path: |
            androbd/build/outputs/apk/**/*.apk
            androbd/build/reports/
            library/build/reports/tests/
          if-no-files-found: error
          retention-days: 14

  emulator-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lotot-build-and-tests
          path: verification-build
      - name: Allow emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r verification-build/androbd/build/outputs/apk/verification/androbd-verification.apk
            adb install -r verification-build/androbd/build/outputs/apk/androidTest/verification/androbd-verification-androidTest.apk
            adb shell device_config put activity_manager data_sync_fgs_timeout_duration 3000
            adb shell am instrument -w -r -e class com.fr3ts0n.ecu.gui.androbd.GatewayReliabilityInstrumentedTest,com.fr3ts0n.ecu.gui.androbd.GatewaySessionInstrumentedTest com.lotot.android.verification.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.txt
            cat instrumentation.txt
            grep -q 'OK (' instrumentation.txt
      - name: Emulator logs
        if: always()
        run: adb logcat -d -s AndroidRuntime LotoTConnection > emulator-logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-results
          path: |
            instrumentation.txt
            emulator-logcat.txt
