import java.util.Properties

def lototiAiProperties = new Properties()
def lototiAiPropertiesPath = System.getenv("LOTOTI_AI_PROPERTIES") ?: "/home/lofa/.config/lototi/ai.properties"
def lototiAiPropertiesFile = file(lototiAiPropertiesPath)
if (lototiAiPropertiesFile.exists()) {
    lototiAiPropertiesFile.withInputStream { lototiAiProperties.load(it) }
}
def lototiBuildConfigString = { String key ->
    def value = lototiAiProperties.getProperty(key, "")
    return '\"' + value.replace('\\', '\\\\').replace('\"', '\\"') + '\"'
}

apply plugin: 'com.android.application'

android {
    namespace = 'com.fr3ts0n.ecu.gui.androbd'
    compileSdk 36

    buildFeatures {
        resValues = true
        buildConfig = true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId 'com.lotot.android'
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 110
        versionName '0.9.0-ui'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [usesCleartextTraffic: "false"]

        resValue "string", "app_version", versionName

        // Prototype-only managed AI credentials. Values are loaded from a private
        // file outside Git. They are embedded in the APK by design for this phase.
        buildConfigField "String", "LOTOTI_AI_PRIMARY", lototiBuildConfigString("lototi.ai.primary")
        buildConfigField "String", "LOTOTI_OPENCODE_API_KEY", lototiBuildConfigString("opencode.apiKey")
        buildConfigField "String", "LOTOTI_OPENCODE_BASE_URL", lototiBuildConfigString("opencode.baseUrl")
        buildConfigField "String", "LOTOTI_OPENCODE_MODEL", lototiBuildConfigString("opencode.model")
        buildConfigField "String", "LOTOTI_NVIDIA_API_KEY", lototiBuildConfigString("nvidia.apiKey")
        buildConfigField "String", "LOTOTI_NVIDIA_BASE_URL", lototiBuildConfigString("nvidia.baseUrl")
        buildConfigField "String", "LOTOTI_NVIDIA_MODEL", lototiBuildConfigString("nvidia.model")
        buildConfigField "String", "LOTOTI_LITELLM_API_KEY", lototiBuildConfigString("litellm.apiKey")
        buildConfigField "String", "LOTOTI_LITELLM_BASE_URL", lototiBuildConfigString("litellm.baseUrl")
        buildConfigField "String", "LOTOTI_LITELLM_MODEL", lototiBuildConfigString("litellm.model")

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }

    lint {
        // abortOnError was previously inside defaultConfig{} where AGP ignores it.
        // Moved here (android{} level) so it takes effect. To enforce lint on new
        // code, run ./gradlew lint, commit the generated lint-baseline.xml, and
        // remove this line.
        abortOnError false
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(':plugin')
    implementation project(':library')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
    implementation 'com.github.anastr:speedviewlib:1.6.1'
    implementation 'androidx.annotation:annotation:1.10.0'
    // core:1.12.0 to keep supporting minSdk 17
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // Local (JVM) unit tests
    testImplementation 'junit:junit:4.13.2'

    // Android instrumented tests
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
