import java.util.Properties

def lototiAiProperties = new Properties()
def lototiAiPropertiesPath = System.getenv("LOTOTI_AI_PROPERTIES") ?: "/home/lofa/.config/lototi/ai.properties"
def lototiAiPropertiesFile = file(lototiAiPropertiesPath)
if (lototiAiPropertiesFile.exists()) {
    lototiAiPropertiesFile.withInputStream { lototiAiProperties.load(it) }
}
def lototiBuildConfigString = { String key ->
    def value = lototiAiProperties.getProperty(key, "")
    return '\"' + value.replace('\\', '\\\\').replace('\"', '\\"') + '\"'
}

apply plugin: 'com.android.application'

android {
    namespace = 'com.fr3ts0n.ecu.gui.androbd'
    compileSdk 37

    buildFeatures {
        resValues = true
        buildConfig = true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId 'com.lotot.android'
        // The language selector exposes exactly these locales. Legacy upstream
        // translations are not selectable and must not define build coverage.
        resourceConfigurations += ['en', 'fr', 'ar-rDZ']
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 113
        versionName '0.9.3-i18n'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [usesCleartextTraffic: "false"]

        resValue "string", "app_version", versionName

        // Only the restricted LoToTi gateway token belongs in the app.
        // Provider credentials and model failover remain server-side.
        buildConfigField "String", "LOTOTI_GATEWAY_API_KEY", lototiBuildConfigString("litellm.apiKey")
        buildConfigField "String", "LOTOTI_GATEWAY_BASE_URL", '"https://aigw.whatsynaptic.com/v1"'

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }

    lint {
        baseline = file('lint-baseline.xml')
        abortOnError true
    }

    testBuildType 'verification'

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        verification {
            initWith debug
            applicationIdSuffix '.verification'
            versionNameSuffix '-verification'
            matchingFallbacks = ['debug']
        }
        aiPreview {
            initWith debug
            applicationIdSuffix '.ai.preview'
            versionNameSuffix '-preview'
            resValue "string", "app_name", "LoToTi AI Preview"
            matchingFallbacks = ['debug']
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(':plugin')
    implementation project(':library')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
    implementation 'com.github.anastr:speedviewlib:1.6.1'
    implementation 'androidx.annotation:annotation:1.10.0'
    // core:1.12.0 to keep supporting minSdk 17
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // Local (JVM) unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'

    // Android instrumented tests
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
}

// The APK must always package assets generated from the current React sources.
// Exec tasks declare inputs/outputs so unchanged local builds stay incremental.
def uiDirectory = rootProject.layout.projectDirectory.dir('lotot-ui')
def installLototUi = tasks.register('installLototUi', Exec) {
    workingDir uiDirectory
    commandLine 'npm', 'ci', '--no-audit', '--no-fund'
    inputs.files(uiDirectory.file('package.json'), uiDirectory.file('package-lock.json'))
    outputs.file(uiDirectory.file('node_modules/.package-lock.json'))
}
def buildLototUi = tasks.register('buildLototUi', Exec) {
    dependsOn installLototUi
    workingDir uiDirectory
    commandLine 'npm', 'run', 'build'
    inputs.files(fileTree(uiDirectory) {
        exclude 'node_modules/**', 'dist/**'
    })
    outputs.dir(layout.projectDirectory.dir('src/main/assets/lotot'))
}
tasks.named('preBuild').configure { dependsOn buildLototUi }
